nt-weight: 700; font-family: inherit\">{{c.label}}\u003c/button>\n\u003c/sc-for>\n\u003c/div>\n\n\u003cdiv style=\"display: flex; gap: 8px\">\n\u003clabel style=\"flex: 1; display: flex\">\n\u003cspan style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">{{t.typeLabel}}\u003c/span>\n\u003cinput type=\"text\" value=\"{{typed}}\" onChange=\"{{setTyped}}\" onKeyDown=\"{{onKey}}\" placeholder=\"{{t.typePh}}\" style=\"flex: 1; width: 100%; box-sizing: border-box; min-height: 46px; border-radius: 23px; border: 1px solid #C9C5B9; background: #F6F5F1; color: #13233A; font-size: 15px; padding: 0 14px; font-family: inherit\">\n\u003c/label>\n\u003cbutton onClick=\"{{submitTyped}}\" style=\"min-height: 46px; padding: 0 16px; border-radius: 23px; border: none; background: #1F4FBF; color: #FFFFFF; font-size: 15px; font-weight: 800; font-family: inherit\">{{t.go}}\u003c/button>\n\u003c/div>\n\n\u003ca ref=\"{{linkRef}}\" href=\"{{goHref}}\" aria-hidden=\"true\" tabindex=\"-1\" style=\"display: none\">go\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/sc-if>\n\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"variant\":{\"editor\":\"enum\",\"options\":[\"fab\",\"banner\"],\"default\":\"fab\"},\"$preview\":{\"width\":390,\"height\":120}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { open: false, listening: false, heard: '', note: '', lang: 'hi', typed: '', go: null, goLabel: '' };\n    this.linkRef = (el) => { this.linkEl = el; };\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this.goTimer);\n    try { if (this.rec) this.rec.abort(); } catch (e) {}\n    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}\n  }\n\n  componentDidUpdate() {\n    const prevGo = this._prevGo;\n    this._prevGo = this.state.go;\n    if (this.state.go && this.state.go !== prevGo) {\n      clearTimeout(this.goTimer);\n      this.goTimer = setTimeout(() => { try { if (this.linkEl) this.linkEl.click(); } catch (e) {} }, 900);\n    }\n  }\n\n  destinations() {\n    return [\n      { file: 'Access.dc.html#isl', hi: 'सांकेतिक भाषा मदद', en: 'Sign language help', keys: ['सांकेतिक', 'साइन', 'sign', 'isl', 'बधिर', 'deaf', 'मूक'] },\n      { file: 'Access.dc.html', hi: 'बूथ साथी', en: 'Booth Buddy', keys: ['बूथ साथी', 'साथी', 'buddy', 'volunteer', 'स्वयंसेवक', 'व्हीलचेयर', 'wheelchair', 'सुगम्य', 'accessib', 'दिव्यांग', 'disab'] },\n      { file: 'ESlip.dc.html', hi: 'ई-स्लिप', en: 'e-Slip', keys: ['स्लिप', 'पर्ची', 'slip', 'qr', 'क्यूआर', 'सूची', 'list', 'नाम', 'epic', 'एपिक', 'क्रमांक', 'serial'] },\n      { file: 'Safety.dc.html', hi: 'सुरक्षा और SOS', en: 'Safety and SOS', keys: ['sos', 'एसओएस', 'सुरक्षा', 'safety', 'safe', 'पुलिस', 'police', 'capf', 'सीएपीएफ', 'खतरा', 'danger'] },\n      { file: 'Queue.dc.html', hi: 'मेरा बूथ', en: 'My booth', keys: ['मेरा बूथ', 'बूथ', 'booth', 'लाइन', 'कतार', 'queue', 'line', 'मतदान केंद्र', 'polling', 'रास्ता', 'route', 'way'] },\n      { file: 'Rehearsal.dc.html', hi: 'मतपत्र अभ्यास', en: 'Ballot practice', keys: ['अभ्यास', 'practice', 'rehearsal', 'evm', 'ईवीएम', 'ballot', 'मतपत्र', 'vvpat'] },\n      { file: 'Selfie.dc.html', hi: 'सेल्फी', en: 'Selfie', keys: ['सेल्फी', 'selfie', 'फोटो', 'photo', 'इनाम', 'prize', 'contest'] },\n      { file: 'Chat.dc.html', hi: 'सहायक', en: 'Sahayak chat', keys: ['सहायक', 'sahayak', 'chat', 'चैट', 'सवाल', 'question', 'helpline', 'हेल्पलाइन', '1950'] },\n      { file: 'AiVoice.dc.html', hi: 'सुनें और अनुवाद', en: 'Listen & Translate', keys: ['अनुवाद', 'translate', 'सूचना', 'notice', 'ब्रेल', 'braille', 'पढ़', 'read'] },\n      { file: 'RampCheck.dc.html', hi: 'बूथ रेटिंग', en: 'Rate your booth', keys: ['रैंप', 'ramp', 'रेटिंग', 'rating', 'rate', 'best booth', 'सुविधा'] },\n      { file: 'Main.dc.html', hi: 'होम', en: 'Home', keys: ['होम', 'home', 'मुख्य', 'शुरू', 'start', 'back', 'वापस'] },\n    ];\n  }\n\n  speak(text) {\n    try {\n      const ss = window.speechSynthesis;\n      if (!ss || typeof SpeechSynthesisUtterance === 'undefined') return;\n      ss.cancel();\n      const u = new SpeechSynthesisUtterance(text);\n      u.lang = this.state.lang === 'en' ? 'en-IN' : 'hi-IN';\n      const v = (ss.getVoices() || []).find((x) => (x.lang || '').toLowerCase().indexOf(this.state.lang === 'en' ? 'en' : 'hi') === 0);\n      if (v) u.voice = v;\n      ss.speak(u);\n    } catch (e) {}\n  }\n\n  navigate(d) {\n    const label = this.state.lang === 'en' ? d.en : d.hi;\n    this.setState({ go: d.file, goLabel: label, note: '', listening: false });\n    this.speak((this.state.lang === 'en' ? 'Opening ' : 'खोल रहे हैं: ') + label);\n  }\n\n  handle(texts) {\n    const list = this.destinations();\n    for (const raw of texts) {\n      const s = String(raw || '').toLowerCase();\n      const d = list.find((x) => x.keys.some((k) => s.indexOf(k) >= 0));\n      if (d) { this.navigate(d); return; }\n    }\n    const msg = this.state.lang === 'en' ? \"Sorry, I didn't catch a place. Try again or tap one below.\" : 'माफ़ कीजिए, समझ नहीं आया। दोबारा बोलें या नीचे से चुनें।';\n    this.setState({ note: msg, listening: false });\n    this.speak(msg);\n  }\n\n  handleQuiet(v) {\n    const s = String(v || '').toLowerCase();\n    const d = this.destinations().find((x) => x.keys.some((k) => s.indexOf(k) >= 0));\n    if (d && !this.state.go) this.navigate(d);\n  }\n\n  listen() {\n    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n    const L = this.state.lang;\n    if (!SR) {\n      this.setState({ note: L === 'en' ? 'Voice recognition is not available here. Tap the box below and use the 🎤 on your keyboard to speak.' : 'यहाँ आवाज़ पहचान उपलब्ध नहीं है। नीचे के बॉक्स पर टैप करें और कीबोर्ड के 🎤 से बोलें।' });\n      return;\n    }\n    try { if (this.rec) this.rec.abort(); } catch (e) {}\n    const rec = new SR();\n    rec.lang = L === 'en' ? 'en-IN' : 'hi-IN';\n    rec.interimResults = true;\n    rec.maxAlternatives = 3;\n    rec.onresult = (e) => {\n      const res = e.results[e.results.length - 1];\n      const heard = res[0].transcript;\n      this.setState({ heard: heard });\n      if (res.isFinal) {\n        const alts = [];\n        for (let i = 0; i \u003c res.length; i++) alts.push(res[i].transcript);\n        this.handle(alts);\n      }\n    };\n    rec.onerror = (ev) => {\n      const blocked = ev && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed');\n      this.setState({ listening: false, note: blocked\n        ? (L === 'en' ? 'This preview blocks the browser microphone. Tap the box below and use the 🎤 on your phone keyboard to speak — it works the same way.' : 'इस प्रीव्यू में ब्राउज़र माइक बंद है। नीचे के बॉक्स पर टैप करें और कीबोर्ड के 🎤 से बोलें — वैसे ही काम करेगा।')\n        : (L === 'en' ? 'Could not hear clearly. Try again.' : 'साफ़ सुनाई नहीं दिया। दोबारा बोलें।') });\n    };\n    rec.onend = () => this.setState({ listening: false });\n    this.rec = rec;\n    this.setState({ listening: true, heard: '', note: '', go: null });\n    try { rec.start(); } catch (e) { this.setState({ listening: false }); }\n  }\n\n  renderVals() {\n    const st = this.state;\n    const L = st.lang;\n    const T = {\n      hi: { title: 'कहाँ जाना है?', sub: 'माइक दबाएँ और बोलें, जैसे \"मेरा बूथ\"', close: 'बंद करें', langAria: 'Switch to English',\n        tryLabel: 'बोलकर देखें या टैप करें', typeLabel: 'लिखकर बताएँ', typePh: 'लिखें या कीबोर्ड 🎤 से बोलें…', go: 'जाएँ',\n        idle: 'माइक दबाकर बोलें', listening: 'सुन रहे हैं…', opening: 'खोल रहे हैं: ' },\n      en: { title: 'Where do you want to go?', sub: 'Tap the mic and say, for example, \"my booth\"', close: 'Close', langAria: 'हिंदी में बदलें',\n        tryLabel: 'Say or tap one of these', typeLabel: 'Type a place', typePh: 'Type, or speak with keyboard 🎤…', go: 'Go',\n        idle: 'Tap the mic and speak', listening: 'Listening…', opening: 'Opening ' },\n    };\n    const t = T[L];\n    con <body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>

<div lang="{{L}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFF8EF; font-family: 'Mukta', system-ui, sans-serif; color: #13233A; display: flex; flex-direction: column; overflow: hidden">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 5px; display: flex"><span style="flex: 1; background: #F08A24"></span><span style="flex: 1; background: #FFFFFF"></span><span style="flex: 1; background: #1E8E4E"></span></div>
<svg width="190" height="190" viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; right: -40px; top: -30px; opacity: 0.12"><g fill="none" stroke="#FFD54A" stroke-width="1.4"><circle cx="50" cy="50" r="44"></circle><circle cx="50" cy="50" r="6"></circle><path d="M50 6v88M6 50h88M19 19l62 62M81 19L19 81M33 9l34 82M67 9L33 91M9 33l82 34M91 33L9 67"></path></g></svg>

<a href="Main.dc.html" aria-label="{{t.back}}" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>

</div>

<path d="M39 18c2-1 8-1 10 0" stroke="#5B2D8E" stroke-width="5" stroke-linecap="round" fill="none"></path>
<path d="M44 10v14" stroke="#5B2D8E" stroke-width="4.5" stroke-linecap="round"></path>
</svg>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 26px; font-weight: 800; line-height: 1.05">{{t.heroTitle}}</span>
<span style="font-size: 14px; color: #C9D2E0; line-height: 1.3">{{t.heroSub}}</span>
</div>
</div>
<div style="position: relative; display: flex; gap: 8px; margin-top: 14px">

<span style="display: flex; flex-direction: column; line-height: 1.1"><b style="font-size: 18px">5</b><span style="font-size: 12px; font-weight: 700">{{t.perDistrict}}</span></span>
</span>
<span style="flex: 1; background: #FFFFFF; color: #13233A; border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 8px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B4500E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>

</div>

</div>

</sc-if>

<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
</span>
<span style="font-size: 15px; font-weight: 700">{{t.placeholder}}</span>
</div>
</sc-if>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'hi', frame: 0, photo: '', consent: false, submitted: false, entryId: '', ink: true, place: true };
  }

  componentWillUnmount() { if (this.state.photo) { try { URL.revokeObjectURL(this.state.photo); } catch (e) {} } }

  renderVals() {
    const st = this.state;
    const L = st.lang;
    const FR = [
      { id: 'tri', hi: 'गर्वित मतदाता', en: 'Proud Voter', bg: '#1F4FBF', bg2: '#13233A' },
      { id: 'stars', hi: 'मेरा पहला वोट', en: 'My First Vote', bg: '#B4500E', bg2: '#5E2604' },
      { id: 'marigold', hi: '85+ में भी वोट', en: 'Voted at 85+', bg: '#0F6E63', bg2: '#083D37' },
      { id: 'family', hi: 'परिवार ने वोट दिया', en: 'Family Voted', bg: '#5B2D8E', bg2: '#2E1A4A' },
    ];
    const T = {
      hi: { back: 'वापस', langAria: 'Switch to English', inkAria: 'स्याही लगी उँगली',
        heroTitle: 'वोट दिया? सेल्फी लो!', heroSub: 'स्याही वाली उँगली के साथ फ़ोटो भेजें और इनाम जीतें',
        perDistrict: 'इनाम हर ज़िले में', state: 'इनाम राज्य स्तर पर',
        steps: ['वोट दें', 'बाहर सेल्फी', 'फ्रेम चुनें', 'भेजें'],
        yourSelfie: 'आपकी सेल्फी', placeholder: 'आपकी सेल्फी यहाँ दिखेगी', take: 'सेल्फी लें', gallery: 'गैलरी', chooseBg: 'फ्रेम चुनें',
        familyTag: 'पूरा परिवार', inkBadge: 'मैंने वोट दिया', place: 'लखनऊ, उत्तर प्रदेश',
        inkSticker: 'स्याही बैज', placeTag: 'ज़िले का नाम',
        consent: 'मैंने वोट दे दिया है। मैं सहमत हूँ कि मुख्य निर्वाचन अधिकारी, उ.प्र. यह फ़ोटो मतदाता जागरूकता के लिए उपयोग कर सकते हैं।',
        submit: 'प्रतियोगिता में भेजें', needPhoto: 'पहले सेल्फी लें', needConsent: 'सहमति पर टिक करें',
        rule: 'सेल्फी मतदान केंद्र के बाहर ही लें — बूथ के अंदर मोबाइल और फ़ोटो की अनुमति नहीं है। EVM या मतपत्र की फ़ोटो न लें।',
        doneTitle: 'बधाई! आपकी सेल्फी प्रतियोगिता में है', district: 'ज़िला: लखनऊ · परिणाम चुनाव के बाद ऐप में',
        entry: 'प्रविष्टि संख्या', shareWa: 'WhatsApp पर शेयर करें', again: 'दूसरी सेल्फी भेजें',
        howTitle: 'विजेता कैसे चुने जाएँगे', judging: 'चुनाव के बाद ज़िला स्वीप समिति हर ज़िले से 5 और CEO कार्यालय राज्य स्तर पर 5 सर्वश्रेष्ठ सेल्फी चुनेंगे। फ़ोटो जाँच के बाद ही प्रकाशित होंगी।',
        share: 'मैंने वोट दिया! आप भी दें। #ApnaBooth #UPVotes' },
      en: { back: 'Back', langAria: 'हिंदी में बदलें', inkAria: 'Inked finger',
        heroTitle: 'Voted? Take a selfie!', heroSub: 'Send a photo with your inked finger and win prizes',
        perDistrict: 'prizes in every district', state: 'prizes at state level',
        steps: ['Vote', 'Selfie outside', 'Pick a frame', 'Submit'],
        yourSelfie: 'Your selfie', placeholder: 'Your selfie will appear here', take: 'Take selfie', gallery: 'Gallery', chooseBg: 'Choose a frame',
        familyTag: 'Whole family', inkBadge: 'I VOTED', place: 'Lucknow, Uttar Pradesh',
        inkSticker: 'Ink badge', placeTag: 'District name',
        consent: 'I have voted. I agree that the Chief Electoral Officer, UP may use this photo for voter awareness.',
        submit: 'Submit to contest', needPhoto: 'Take a selfie first', needConsent: 'Tick the consent box',
        rule: 'Take the selfie outside the polling station — phones and photography are not allowed inside the booth. Never photograph the EVM or ballot.',
        doneTitle: 'Congratulations! Your selfie is in the contest', district: 'District: Lucknow · Results in the app after the election',
        entry: 'Entry number', shareWa: 'Share on WhatsApp', again: 'Send another selfie',
        howTitle: 'How winners are chosen', judging: 'After the election, the district SVEEP committee picks the best 5 in every district and the CEO Office picks the best 5 at state level. Photos are published only after review.',
        share: 'I voted! You vote too. #ApnaBooth #UPVotes' },
    };
    const t = T[L];
    const f = FR[st.frame];
    const can = !!st.photo && st.consent;
    const stage = st.photo ? (st.consent ? 3 : 2) : 1;
    const chip = (on) => 'flex: 1; min-height: 44px; border-radius: 22px; font-size: 14px; font-weight: 800; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; ' +
      (on ? 'border: 2px solid #5B2D8E; background: #F1EAFA; color: #5B2D8E' : 'border: 2px solid #D9D0C2; background: #FFFFFF; color: #6B7380');
    return {
      L, t,
      langBtn: L === 'en' ? 'हिं' : 'EN',
      toggleLang: () => this.setState({ lang: L === 'en' ? 'hi' : 'en' }),
      steps: t.steps.map((label, i) => ({
        n: i + 1, label,
        style: 'display: flex; flex-direction: column; align-items: center; gap: 4px; color: ' + (i <= stage ? '#13233A' : '#8A8F99'),
        dot: 'width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; ' +
          (i < stage ? 'background: #1E8E4E; color: #FFFFFF' : (i === stage ? 'background: #F08A24; color: #FFFFFF' : 'background: #EFE7DA; color: #6B7380')),
      })),
      frame: { caption: L === 'en' ? f.en : f.hi },
      fr: { tri: f.id === 'tri', stars: f.id === 'stars', marigold: f.id === 'marigold', family: f.id === 'family' },
      frameStyle: 'position: relative; height: 360px; border-radius: 22px; overflow: hidden; border: 6px solid #FFFFFF; box-shadow: 0 10px 26px rgba(19,35,58,0.22); transform: rotate(-1deg); background: linear-gradient(160deg, ' + f.bg + ', ' + f.bg2 + ')',
      frames: FR.map((x, i) => ({
        short: L === 'en' ? x.en : x.hi, sel: i === st.frame ? 'true' : 'false',
        pick: () => this.setState({ frame: i }),
        swatch: 'width: 100%; height: 46px; border-radius: 10px; background: linear-gradient(160deg, ' + x.bg + ', ' + x.bg2 + ');' +
          (x.id === 'tri' ? ' box-shadow: inset 0 0 0 3px #F08A24, inset 0 0 0 5px #FFFFFF, inset 0 0 0 7px #1E8E4E' : ''),
        style: 'display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 5px 5px 7px; border-radius: 14px; background: #FFFFFF; font-family: inherit; cursor: pointer; ' +
          (i === st.frame ? 'border: 3px solid #F08A24; box-shadow: 0 4px 10px rgba(240,138,36,0.3)' : 'border: 3px solid #EADFCF'),
      })),
      photo: st.photo, hasPhoto: !!st.photo, noPhoto: !st.photo,
      onFile: (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (st.photo) { try { URL.revokeObjectURL(st.photo); } catch (er) {} }
        this.setState({ photo: URL.createObjectURL(file) });
      },
      inkOn: st.ink, placeOn: st.place,
      inkPressed: st.ink ? 'true' : 'false', placePressed: st.place ? 'true' : 'false',
      inkChip: chip(st.ink), placeChip: chip(st.place),
      toggleInk: () => this.setState({ ink: !st.ink }),
      togglePlace: () => this.setState({ place: !st.place }),
      consent: st.consent,
      toggleConsent: () => this.setState({ consent: !st.consent }),
      cantSubmit: !can,
      submitLabel: can ? t.submit : (!st.photo ? t.needPhoto : t.needConsent),
      submitStyle: 'min-height: 58px; border-radius: 18px; border: none; font-size: 18px; font-weight: 800; font-family: inherit; ' +
        (can ? 'background: #F08A24; color: #13233A; box-shadow: 0 5px 0 #B4500E; cursor: pointer' : 'background: #EFE7DA; color: #6B7380'),
      submit: () => { if (can) this.setState({ submitted: true, entryId: 'LKO-' + (10000 + Math.floor(Math.random() * 89999)) }); },
      submitted: st.submitted, notSubmitted: !st.submitted, entryId: st.entryId,
      waHref: 'https://wa.me/?text=' + encodeURIComponent(t.share),
      again: () => this.setState({ submitted: false, photo: '', consent: false }),
    };
  }
}
</script>
