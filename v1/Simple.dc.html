<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }

  renderVals() {
    const text = 'नमस्ते रमेश जी। पहला बटन: मेरा बूथ, अभी लाइन छोटी है। दूसरा बटन: मदद चाहिए, गाड़ी या व्हीलचेयर के लिए। तीसरा बटन: शिकायत, फ़ोटो या आवाज़ से।';
    return {
      listen: () => {
        try {
          const ss = window.speechSynthesis;
          if (!ss || typeof SpeechSynthesisUtterance === 'undefined') return;
          ss.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'hi-IN';
          u.rate = 0.85;
          const v = (ss.getVoices() || []).find((x) => (x.lang || '').toLowerCase().indexOf('hi') === 0);
          if (v) u.voice = v;
          ss.speak(u);
        } catch (e) {}
      }
    };
  }
}
</script>
