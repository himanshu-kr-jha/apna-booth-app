<script data-offline-shim>(function(){var M={"Rehearsal.dc.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>Apna Booth — Ballot Rehearsal\u003c/title>\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&amp;display=swap\" rel=\"stylesheet\">\n\u003cstyle>\nbody{margin:0}\na{color:#FFD54A;text-decoration:none}a:hover{color:#FFE58A}\nbutton{font-family:inherit;cursor:pointer}\n@keyframes ab-slip{0%{transform:translateY(-110%)}12%{transform:translateY(0)}88%{transform:translateY(0)}100%{transform:translateY(120%)}}\n@keyframes ab-glow{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.9)}50%{box-shadow:0 0 10px 4px rgba(229,57,53,.9)}}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv lang=\"{{L}}\" style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; font-family: 'Mukta', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 12px; overflow: hidden\">\n\n\u003cdiv style=\"display: flex; align-items: center; gap: 8px\">\n\u003ca href=\"Access.dc.html\" aria-label=\"Back to accessibility\" style=\"width: 44px; height: 44px; border-radius: 22px; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex-shrink: 0\">\n\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M15 5l-7 7 7 7\">\u003c/path>\u003c/svg>\n\u003c/a>\n\u003cdiv style=\"flex: 1; display: flex; flex-direction: column; line-height: 1.1; min-width: 0\">\n\u003cspan style=\"font-size: 20px; font-weight: 800\">{{t.title}}\u003c/span>\n\u003cspan style=\"font-size: 12px; color: #C9D2E0\">{{t.sub}}\u003c/span>\n\u003c/div>\n tyle=\"display: flex; flex-direction: column; border: 2px solid #4A4F48; border-radius: 6px; overflow: hidden\">\n\u003csc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"9\">\n\u003cdiv style=\"{{r.rowStyle}}\">\n\u003cbutton onClick=\"{{r.focus}}\" aria-label=\"{{r.aria}}\" style=\"flex: 1; display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 6px; border: none; background: #FFFFFF; color: #111111; text-align: left; min-width: 0\">\n\u003cspan style=\"width: 22px; font-size: 16px; font-weight: 800; text-align: center; flex-shrink: 0\">{{r.n}}\u003c/span>\n\u003cspan style=\"flex: 1; display: flex; flex-direction: column; line-height: 1.12; min-width: 0\">\n\u003cspan style=\"font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{r.nameHi}}\u003c/span>\n\u003cspan style=\"font-size: 11px; font-weight: 600; color: #3A3F45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{r.nameEn}}\u003c/span>\n\u003c/span>\n\u003cspan style=\"{{r.photoStyle}}\">\n\u003csvg width=\"22\" height=\"26\" viewBox=\"0 0 24 28\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"9\" r=\"5.5\" fill=\"#8C939C\">\u003c/circle>\u003cpath d=\"M2 28c0-7 4.5-11 10-11s10 4 10 11z\" fill=\"#8C939C\">\u003c/path>\u003c/svg>\n\u003c/span>\n\u003cspan style=\"width: 40px; height: 40px; border: 1.5px solid #111111; border-radius: 3px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #FFFFFF\">\n\u003csvg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"{{r.sym}}\">\u003c/path>\u003c/svg>\n\u003c/span>\n\u003c/button>\n\u003cdiv style=\"width: 96px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; background: #B9BCB6; border-left: 2px solid #4A4F48\">\n\u003cspan style=\"{{r.lamp}}\">\u003c/span>\n\u003cbutton aria-label=\"{{r.voteAria}}\" onClick=\"{{r.vote}}\" disabled=\"{{busy}}\" style=\"width: 40px; height: 28px; border-radius: 14px; border: 2px solid #0D2F7A; background: #1E56D6; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25); flex-shrink: 0\">\u003c/button>\n\u003cspan aria-hidden=\"true\" style=\"font-size: 15px; color: #111111; line-height: 1; letter-spacing: 1px\">{{r.braille}}\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"display: flex; justify-content: space-between; gap: 8px\">\n\u003cbutton aria-label=\"{{t.prev}}\" onClick=\"{{prev}}\" style=\"flex: 1; height: 56px; border-radius: 16px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6l-8 6 8 6z\">\u003c/path>\u003cpath d=\"M6 6v12\">\u003c/path>\u003c/svg>\n\u003c/button>\n\u003cbutton aria-label=\"{{t.repeatAria}}\" onClick=\"{{repeat}}\" style=\"flex: 1.4; height: 56px; border-radius: 16px; border: none; background: #FFD54A; color: #0B1220; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800\">\n\u003csvg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M4 9h4l5-4v14l-5-4H4z\">\u003c/path>\u003cpath d=\"M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11\">\u003c/path>\u003c/svg>\n{{t.repeat}}\n\u003c/button>\n\u003cbutton aria-label=\"{{t.next}}\" onClick=\"{{next}}\" style=\"flex: 1; height: 56px; border-radius: 16px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M6 6l8 6-8 6z\">\u003c/path>\u003cpath d=\"M18 6v12\">\u003c/path>\u003c/svg>\n\u003c/button>\n\u003c/div>\n\n\u003cspan style=\"font-size: 12px; color: #C9D2E0; text-align: center; line-height: 1.35\">{{t.foot}}\u003c/span>\n\n\u003csc-if value=\"{{slipOn}}\" hint-placeholder-val=\"{{false}}\">\n\u003cdiv role=\"dialog\" aria-label=\"{{t.vvpat}}\" style=\"position: absolute; left: 0; right: 0; bottom: 0; background: #1A1F1A; border-top: 3px solid #FFD54A; border-radius: 20px 20px 0 0; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -12px 30px rgba(0,0,0,0.5)\">\n\u003cdiv style=\"display: flex; justify-content: space-between; align-items: center\">\n\u003cspan style=\"font-size: 16px; font-weight: 800\">{{t.vvpat}}\u003c/span>\n\u003cspan style=\"font-size: 14px; font-weight: 800; color: #FFD54A\">{{t.visible}} {{secs}}s\u003c/span>\n\u003c/div>\n\u003cdiv style=\"height: 230px; border-radius: 12px; background: #2E352E; border: 6px solid #4A524A; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; box-sizing: border-box\">\n\u003cdiv style=\"width: 170px; background: #FDFCF7; color: #111111; border-radius: 2px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; animation: ab-slip 7s linear forwards; box-shadow: 0 2px 6px rgba(0,0,0,0.4)\">\n\u003cspan style=\"font-size: 30px; font-weight: 800; line-height: 1\">{{slip.n}}\u003c/span>\n\u003cspan style=\"font-size: 16px; font-weight: 800; text-align: center; line-height: 1.15\">{{slip.nameHi}}\u003c/span>\n\u003cspan style=\"font-size: 12px; font-weight: 600; text-align: center\">{{slip.nameEn}}\u003c/span>\n\u003csvg width=\"56\" height=\"56\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#111111\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"{{slip.symName}}\">\u003cpath d=\"{{slip.sym}}\">\u003c/path>\u003c/svg>\n\u003c/div>\n\u003c/div>\n\u003cspan style=\"font-size: 13px; color: #C9D2E0; text-align: center; line-height: 1.35\">{{t.vvpatNote}}\u003c/span>\n\u003c/div>\n\u003c/sc-if>\n\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { i: 2, lang: 'en', voted: null, secs: 0 };\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.slipTimer);\n    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}\n    try { if (this.ac) this.ac.close(); } catch (e) {}\n  }\n\n  say(text) {\n    try {\n      const ss = window.speechSynthesis;\n      if (!ss || typeof SpeechSynthesisUtterance === 'undefined') return;\n      ss.cancel();\n      const u = new SpeechSynthesisUtterance(text);\n      const lang = this.state.lang === 'hi' ? 'hi-IN' : 'en-IN';\n      u.lang = lang;\n      u.rate = 0.9;\n      const vs = ss.getVoices() || [];\n      const v = vs.find((x) => (x.lang || '').toLowerCase() === lang.toLowerCase()) ||\n        vs.find((x) => (x.lang || '').toLowerCase().indexOf(lang.slice(0, 2)) === 0);\n      if (v) u.voice = v;\n      ss.speak(u);\n    } catch (e) {}\n  }\n\n  beep() {\n    try {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return;\n      if (!this.ac) this.ac = new AC();\n      const o = this.ac.createOscillator();\n      const g = this.ac.createGain();\n      o.type = 'sine';\n      o.frequency.value = 1050;\n      g.gain.value = 0.12;\n      o.connect(g);\n      g.connect(this.ac.destination);\n      o.start();\n      o.stop(this.ac.currentTime + 1.6);\n    } catch (e) {}\n  }\n\n  renderVals() {\n    const circle = (cx, cy, r) => 'M' + (cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';\n    let petals = '';\n    for (let k = 0; k \u003c 8; k++) {\n      const a = (Math.PI / 4) * k;\n      petals += circle(+(12 + 5 * Math.cos(a)).toFixed(2), +(9 + 5 * Math.sin(a)).toFixed(2), 1.8);\n    }\n    const SYM = {\n      sunflower: circle(12, 9, 2.4) + petals + 'M12 15.8V22M12 19q-3-2.5-5.5-1M12 20.5q3-2.5 5.5-1',\n      bell: 'M12 3v2M8 8.5a4 4 0 0 1 8 0c0 4 1 6.5 2.5 8.5h-13C7 15 8 12.5 8 8.5z' + circle(12, 19.3, 1.5),\n      jug: 'M8 5h7l-1 3.5c3 1.5 4 4 4 7 0 3.5-2.5 5.5-6 5.5s-6-2-6-5.5c0-3 1-5.5 4-7zM8 5L5.5 3.5M17.5 9.5c2.5 0 3.5 2 3.5 4s-1.5 3.5-3.5 3.5',\n      ship: 'M3 15h18l-3 5H6zM12 3v12M12 4l6 9h-6M12 6.5l-4.5 6.5H12',\n      nib: 'M12 22L7 13l2-8h6l2 8zM12 22v-7.7M9 5h6' + circle(12, 13, 1.3),\n      tree: circle(12, 9, 6.5) + 'M12 15.5V22M9 22h6M12 18.5l-2.5-2M12 17.5l2.5-2',\n      umbrella: 'M2.5 12a9.5 8 0 0 1 19 0c-1.5-1.2-3.2-1.2-4.75 0-1.5-1.2-3.2-1.2-4.75 0-1.5-1.2-3.2-1.2-4.75 0-1.5-1.2-3.2-1.2-4.75 0zM12 12v7.5a2 2 0 0 1-4 0M12 2.5V4',\n      bucket: 'M5 8h14l-2 13H7zM5 8c0-5.5 14-5.5 14 0M6 12h12',\n      nota: 'M6 3h12v18H6zM9 8l6 8M15 8l-6 8'\n    };\n    const list = [\n      { en: 'Asha Singh', hi: 'आशा सिंह', pEn: 'Lok Seva Dal', pHi: 'लोक सेवा दल', s: 'sunflower', sEn: 'Sunflower', sHi: 'सूरजमुखी' },\n      { en: 'Mohd. Imran', hi: 'मो. इमरान', pEn: 'Nagrik Ekta Party', pHi: 'नागरिक एकता पार्टी', s: 'bell', sEn: 'Bell', sHi: 'घंटी' },\n      { en: 'Rakesh Kumar', hi: 'राकेश कुमार', pEn: 'Gram Vikas Morcha', pHi: 'ग्राम विकास मोर्चा', s: 'jug', sEn: 'Water jug', sHi: 'पानी का जग' },\n      { en: 'Sunil Gupta', hi: 'सुनील गुप्ता', pEn: 'Independent', pHi: 'निर्दलीय', s: 'ship', sEn: 'Ship', sHi: 'जहाज़' },\n      { en: 'Pooja Rani', hi: 'पूजा रानी', pEn: 'Shiksha Nyay Party', pHi: 'शिक्षा न्याय पार्टी', s: 'nib', sEn: 'Pen nib', sHi: 'पेन की निब' },\n      { en: 'Harish Chandra', hi: 'हरीश चंद्र', pEn: 'Kisan Shakti Dal', pHi: 'किसान शक्ति दल', s: 'tree', sEn: 'Tree', sHi: 'पेड़' },\n      { en: 'Fatima Bano', hi: 'फ़ातिमा बानो', pEn: 'Independent', pHi: 'निर्दलीय', s: 'umbrella', sEn: 'Umbrella', sHi: 'छाता' },\n      { en: 'Vinod Mishra', hi: 'विनोद मिश्रा', pEn: 'Yuva Jan Party', pHi: 'युवा जन पार्टी', s: 'bucket', sEn: 'Bucket', sHi: 'बाल्टी' },\n      { en: 'None of the Above', hi: 'इनमें से कोई नहीं', pEn: 'NOTA', pHi: 'नोटा', s: 'nota', sEn: 'NOTA symbol', sHi: 'नोटा चिन्ह', nota: true }\n    ];\n    const BR = ['⠼⠁', '⠼⠃', '⠼⠉', '⠼⠙', '⠼⠑', '⠼⠋', '⠼⠛', '⠼⠓', '⠼⠊'];\n\n    const L = this.state.lang;\n    const T = {\n      en: {\n        title: 'Ballot rehearsal', sub: 'Practice EVM · Sample Constituency · demo', voiceOn: 'VOICE', langAria: 'Switch to Hindi',\n        bu: 'BALLOT UNIT', ready: 'READY', busy: 'BUSY', prev: 'Previous candidate', next: 'Next candidate', repeat: 'Repeat',\n        repeatAria: 'Repeat this candidate aloud', vvpat: 'VVPAT slip', visible: 'Visible for',\n        vvpatNote: 'Check the serial number, name and symbol on the slip. In the real booth the slip drops into a sealed box after 7 seconds.',\n        foot: 'Tap a row to hear it · press the blue button to practise · Braille numbers sit beside each button. Demo data: all names, parties and symbols are fictional.',\n        button: 'Button', of: 'of', symbol: 'Symbol', pressBtn: 'Practice vote for button',\n        voted: 'Beep. You pressed button', checkSlip: 'Check the VVPAT slip.'\n      },\n      hi: {\n        title: 'मतपत्र अभ्यास', sub: 'EVM अभ्यास · नमूना निर्वाचन क्षेत्र · डेमो', voiceOn: 'आवाज़', langAria: 'Switch to English',\n        bu: 'बैलेट यूनिट', ready: 'तैयार', busy: 'व्यस्त', prev: 'पिछला उम्मीदवार', next: 'अगला उम्मीदवार', repeat: 'दोबारा',\n        repeatAria: 'यह उम्मीदवार फिर सुनें', vvpat: 'VVPAT पर्ची', visible: 'दिखेगी',\n        vvpatNote: 'पर्ची पर क्रम संख्या, नाम और चिन्ह जाँचें। असली बूथ में 7 सेकंड बाद पर्ची सील बक्से में गिर जाती है।',\n        foot: 'सुनने के लिए पंक       { en: 'Vinod Mishra', hi: 'विनोद मिश्रा', pEn: 'Yuva Jan Party', pHi: 'युवा जन पार्टी', s: 'bucket', sEn: 'Bucket', sHi: 'बाल्टी' },
      { en: 'None of the Above', hi: 'इनमें से कोई नहीं', pEn: 'NOTA', pHi: 'नोटा', s: 'nota', sEn: 'NOTA symbol', sHi: 'नोटा चिन्ह', nota: true }
    ];
    const BR = ['⠼⠁', '⠼⠃', '⠼⠉', '⠼⠙', '⠼⠑', '⠼⠋', '⠼⠛', '⠼⠓', '⠼⠊'];

    const L = this.state.lang;
    const T = {
      en: {
        title: 'Ballot rehearsal', sub: 'Practice EVM · Sample Constituency · demo', voiceOn: 'VOICE', langAria: 'Switch to Hindi',
        bu: 'BALLOT UNIT', ready: 'READY', busy: 'BUSY', prev: 'Previous candidate', next: 'Next candidate', repeat: 'Repeat',
        repeatAria: 'Repeat this candidate aloud', vvpat: 'VVPAT slip', visible: 'Visible for',
        vvpatNote: 'Check the serial number, name and symbol on the slip. In the real booth the slip drops into a sealed box after 7 seconds.',
        foot: 'Tap a row to hear it · press the blue button to practise · Braille numbers sit beside each button. Demo data: all names, parties and symbols are fictional.',
        button: 'Button', of: 'of', symbol: 'Symbol', pressBtn: 'Practice vote for button',
        voted: 'Beep. You pressed button', checkSlip: 'Check the VVPAT slip.'
      },
      hi: {
        title: 'मतपत्र अभ्यास', sub: 'EVM अभ्यास · नमूना निर्वाचन क्षेत्र · डेमो', voiceOn: 'आवाज़', langAria: 'Switch to English',
        bu: 'बैलेट यूनिट', ready: 'तैयार', busy: 'व्यस्त', prev: 'पिछला उम्मीदवार', next: 'अगला उम्मीदवार', repeat: 'दोबारा',
        repeatAria: 'यह उम्मीदवार फिर सुनें', vvpat: 'VVPAT पर्ची', visible: 'दिखेगी',
        vvpatNote: 'पर्ची पर क्रम संख्या, नाम और चिन्ह जाँचें। असली बूथ में 7 सेकंड बाद पर्ची सील बक्से में गिर जाती है।',
        foot: 'सुनने के लिए पंक्ति पर टैप करें · अभ्यास के लिए नीला बटन दबाएँ · हर बटन के पास ब्रेल अंक है। डेमो: सभी नाम, दल और चिन्ह काल्पनिक हैं।',
        button: 'बटन', of: 'में से', symbol: 'चिन्ह', pressBtn: 'अभ्यास वोट, बटन',
        voted: 'बीप। आपने बटन दबाया', checkSlip: 'VVPAT पर्ची जाँचें।'
      }
    };
    const t = T[L];
    const i = this.state.i;
    const busy = this.state.voted !== null;

    const describe = (k) => {
      const c = list[k];
      return t.button + ' ' + (k + 1) + (L === 'hi' ? ', कुल ' : ' of ') + list.length + '. ' + c[L] + '. ' + (c.nota ? '' : c[L === 'hi' ? 'pHi' : 'pEn'] + '. ') +
        t.symbol + ': ' + c[L === 'hi' ? 'sHi' : 'sEn'] + '.';
    };
    const focusOn = (k) => { this.setState({ i: k }); this.say(describe(k)); };

    const vote = (k) => {
      if (this.state.voted !== null) return;
      this.beep();
      this.setState({ i: k, voted: k, secs: 7 });
      const c = list[k];
      this.say(t.voted + ' ' + (k + 1) + ', ' + c[L] + '. ' + t.checkSlip);
      clearInterval(this.slipTimer);
      this.slipTimer = setInterval(() => {
        const s = this.state.secs - 1;
        if (s <= 0) { clearInterval(this.slipTimer); this.setState({ voted: null, secs: 0 }); }
        else this.setState({ secs: s });
      }, 1000);
    };

    const rows = list.map((c, k) => {
      const on = k === i;
      const lit = this.state.voted === k;
      return {
        n: String(k + 1),
        nameHi: c.hi,
        nameEn: c.en,
        sym: SYM[c.s],
        braille: BR[k],
        aria: describe(k),
        voteAria: t.pressBtn + ' ' + (k + 1) + ', ' + c[L],
        rowStyle: 'display: flex; height: 54px; border-bottom: ' + (k === list.length - 1 ? 'none' : '1.5px solid #4A4F48') + '; ' +
          (on ? 'outline: 3px solid #FFD54A; outline-offset: -3px; position: relative; z-index: 1' : ''),
        photoStyle: 'width: 34px; height: 40px; border: 1px solid #9AA0A6; background: ' + (c.nota ? '#FFFFFF' : '#E6E8EA') +
          '; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; flex-shrink: 0' + (c.nota ? '; visibility: hidden' : ''),
        lamp: 'width: 12px; height: 12px; border-radius: 6px; flex-shrink: 0; border: 1.5px solid #5A1010; background: ' +
          (lit ? '#FF3B30; animation: ab-glow 0.9s ease-in-out infinite' : '#7A2A2A'),
        focus: () => focusOn(k),
        vote: () => vote(k)
      };
    });

    const cur = list[i];
    const slipK = this.state.voted;
    const sc = slipK !== null ? list[slipK] : null;

    return {
      L, t, rows, busy,
      langBtn: L === 'en' ? 'हिं' : 'EN',
      num: String(i + 1),
      curName: cur[L],
      curParty: (cur.nota ? '' : cur[L === 'hi' ? 'pHi' : 'pEn'] + ' · ') + t.symbol + ': ' + cur[L === 'hi' ? 'sHi' : 'sEn'],
      readyText: busy ? t.busy : t.ready,
      readyLamp: 'width: 10px; height: 10px; border-radius: 5px; border: 1.5px solid #1C3B1C; background: ' + (busy ? '#3B4A3B' : '#2ECC40'),
      slipOn: slipK !== null,
      secs: String(this.state.secs),
      slip: sc ? { n: String(slipK + 1), nameHi: sc.hi, nameEn: sc.en, sym: SYM[sc.s], symName: sc[L === 'hi' ? 'sHi' : 'sEn'] }
        : { n: '', nameHi: '', nameEn: '', sym: '', symName: '' },
      toggleLang: () => this.setState({ lang: L === 'en' ? 'hi' : 'en' }),
      prev: () => focusOn(Math.max(0, i - 1)),
      next: () => focusOn(Math.min(list.length - 1, i + 1)),
      repeat: () => this.say(describe(i))
    };
  }
}
</script>
</body>
